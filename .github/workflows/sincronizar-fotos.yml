name: Optimizar fotos de Halloween y Navidad
on:
  push:
    branches: [main]
    paths:
      - catalogo.json
      - navidad.json
      - navidad.js
      - scripts/sincronizar_fotos.py
      - .github/workflows/sincronizar-fotos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Crear miniaturas WebP con numeración original
        run: python scripts/sincronizar_fotos.py
      - name: Instalar modelo visual open source para búsqueda por descripción
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'torch>=2.3,<3' 'safetensors>=0.4'
      - name: Reconocer figuras y generar índice visual
        continue-on-error: true
        run: python scripts/etiquetar_fotos.py
      - name: Publicar fotografías optimizadas en el mismo repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ etiquetas-visuales.js
          if ! git diff --cached --quiet; then
            git commit -m "assets: fotografías e índice visual de Halloween y Navidad"
            git push
          fi

