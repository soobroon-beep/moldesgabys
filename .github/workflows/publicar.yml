name: Publicar tienda en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio público sin archivos privados
        run: |
          mkdir -p _site
          cp index.html styles.css novedades.css temporadas.css marca.css identidad-2026.css navegacion-parallax.css movil-compacto.css redes-sociales.css scroll-escenas.css scroll-escenas.js escenarios-vivos.css escenarios-vivos.js cursores.js navegacion-parallax.js app.js novedades.js temporadas.js catalogo.js catalogo.json navidad.js navidad.json etiquetas-visuales.js configuracion.js favicon.svg manifest.webmanifest _site/
          if [ -d images ]; then cp -r images _site/; fi
          if [ -d assets ]; then cp -r assets _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4