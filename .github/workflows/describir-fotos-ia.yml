name: IA describe las fotos del catálogo
on:
  push:
    branches: [main]
    paths:
      - scripts/describir_fotos_ia.py
      - .github/workflows/describir-fotos-ia.yml
      - catalogo.json
      - navidad.json
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: describir-fotos-ia
  cancel-in-progress: false
jobs:
  describir:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Describir fotos con IA de visión gratuita (retoma donde se quedó)
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          LIMITE_MINUTOS: '320'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/describir_fotos_ia.py
      - name: Volver a publicar la tienda con las descripciones nuevas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --ref main || true
